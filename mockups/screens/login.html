<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Log in · Fervid Budget</title>
<link rel="stylesheet" href="../mockup.css">
<script src="../mockup.js" defer></script>
</head>
<body data-title="Log in" data-chrome="none" data-persona-default="employee">

<div class="login-stage">
  <main class="login-card">
    <div class="lc-mark">
      <span class="sq">F</span>
      <span><b style="display:block;font-size:15px">Fervid Budget</b><small class="muted" style="font-size:11.5px">Smart Solutions</small></span>
    </div>
    <h1>Log in</h1>
    <p class="lc-sub">Requests, approvals and payments for Fervid Smart Solutions.</p>

    <form class="stack-12" onsubmit="return false">
      <div class="field"><label for="email">Email</label><input id="email" type="email" autocomplete="username" value="arun.mehta@fervid.in"></div>
      <div class="field"><label for="pw">Password</label><input id="pw" type="password" autocomplete="current-password" value="············"></div>
      <a class="btn primary block" href="dashboard.html">Log in</a>
      <p class="hint" style="margin:0;text-align:center">Forgotten your password? Ask an administrator to reset it.</p>
    </form>
  </main>
</div>

</body>
</html>
